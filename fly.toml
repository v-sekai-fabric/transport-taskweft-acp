# Fly.io config for the hosted taskweft-acp door: the OpenBao-gated MCP bridge and the
# executor WebSocket endpoint. Sessions live in weft_fdb databases on the weftspun-fdb
# cluster over 6PN; the machine stays up (a run must not cold-start mid-step).

app = "weftspun-taskweft-acp"
primary_region = "sjc"

[build]
  dockerfile = "Containerfile"

[env]
  PORT = "8080"
  BAO_ADDR = "https://weftspun-bao.internal:8200"
  BAO_TLS_SERVER_NAME = "weftspun-bao.internal"
  TASKWEFT_ACP_STORE = "fabric"
  TASKWEFT_ACP_SERVE = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
