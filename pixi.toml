[workspace]
name = "transport-taskweft-acp"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

# The store helper's build inputs on a desk: SQLite headers and import library. Elixir,
# Erlang and the C compiler come from the desk (scoop, Visual Studio); CI uses apt.
[dependencies]
libsqlite = ">=3.45"

[tasks]
weft-sql-win = { cmd = "nmake /F Makefile.win SQLITE_INC=%CONDA_PREFIX%\\Library\\include SQLITE_LIB=%CONDA_PREFIX%\\Library\\lib" }
weft-sql = { cmd = "make SQLITE_CFLAGS=-I$CONDA_PREFIX/include SQLITE_LIBS='-L$CONDA_PREFIX/lib -lsqlite3'" }
