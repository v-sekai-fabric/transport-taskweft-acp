name: Checks

on:
  pull_request:
  push:
    branches: [main/main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
      # taskweft's NIF needs a C++ toolchain; the store helper needs SQLite's headers.
      - run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      - run: make
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      # A Dialyzer finding is a failure, not a warning.
      - run: mix dialyzer --format short
